
name: Deploy to Minikube using GitHub Actions

on: [push]

jobs:
  job1:
    runs-on: ubuntu-latest
    name: build Node.js Docker Image and deploy to minikube

    steps:
      - uses: actions/checkout@v2

      - name: Start minikube
        uses: medyagh/setup-minikube@master

      - name: Try the cluster !
        run: kubectl get pods -A

      - name: Build image
        run: |
          minikube image build -t devopshint/node-app:latest .
          echo "Verifying Minikube images:"
          minikube image ls


      - name: Deploy to minikube
        run: |
          kubectl apply -f k8s-node-app.yaml
      

      - name: Debug Node.js Pod
        run: |
          echo "Checking deployment status..."
          kubectl rollout status deployment/nodejs-app --timeout=120s || true

          echo "Checking pods..."
          kubectl get pods -l app=nodejs-app -o wide

          echo "Checking service endpoints..."
          kubectl get endpoints nodejs-app

          echo "Describing pods..."
          kubectl describe pods -l app=nodejs-app

          echo "Checking application logs..."
          kubectl logs deployment/nodejs-app --all-containers=true --tail=100 || true

      - name: Test service URLs
        run: |
          minikube service list
          minikube service nodejs-app --url
